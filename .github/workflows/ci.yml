name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: make lint

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make docs
      - name: External links (informational; other people's sites go down)
        continue-on-error: true
        run: python scripts/check_docs.py --external

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - uses: actions/checkout@v5
        with:
          repository: chinmaya-chhatre/hookscope-prod
          ref: b4e012c304ea69ca29fd544ab0ab2864e5cf11f6
          path: hookscope-src
      - run: pip install -r hookscope-src/requirements.txt
      - name: Verify integration dependency
        run: python -c "import hookscope.main; print(hookscope.main.__file__)"
        env:
          PYTHONPATH: ${{ github.workspace }}/hookscope-src
      - run: make test
        env:
          PYTHONPATH: ${{ github.workspace }}/hookscope-src
          PYTEST_ADDOPTS: --junitxml=test-results.xml
      - name: Require complete test execution
        run: python scripts/check_test_report.py test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

  compose:
    name: compose files are valid
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make config PYTHON=python
      - name: Build SMS handler runtime
        run: docker build -f recipes/twilio-sms-to-support-ticket/handler/Dockerfile .
      - name: Start pinned SMS demonstration stack
        run: docker compose -f docker-compose.base.yml -f recipes/twilio-sms-to-support-ticket/docker-compose.yml up --build --wait -d
        env:
          HOOKSCOPE_RULES_FILE: ./recipes/twilio-sms-to-support-ticket/rules.json
      - name: Require signed SMS stack delivery
        run: docker compose -f docker-compose.base.yml -f recipes/twilio-sms-to-support-ticket/docker-compose.yml exec -T ingress python smoke.py
      - name: Stop SMS demonstration stack
        if: always()
        run: docker compose -f docker-compose.base.yml -f recipes/twilio-sms-to-support-ticket/docker-compose.yml down -v

  discover:
    name: find recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "recipes=$(python3 scripts/list_recipes.py)" >> "$GITHUB_OUTPUT"

  recipe:
    # One job per recipe, so a failure names the recipe. A recipe with no tests fails here:
    # pytest exits non-zero when it collects nothing, and a recipe does not ship without tests.
    name: recipe ${{ matrix.recipe }}
    needs: discover
    if: needs.discover.outputs.recipes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.discover.outputs.recipes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The end-to-end tests run HookScope in-process, so they need its source and dependencies.
      - uses: actions/checkout@v5
        with:
          repository: chinmaya-chhatre/hookscope-prod
          ref: b4e012c304ea69ca29fd544ab0ab2864e5cf11f6
          path: hookscope-src
      - run: pip install -r hookscope-src/requirements.txt
      - run: make test RECIPE=${{ matrix.recipe }}
        env:
          PYTHONPATH: ${{ github.workspace }}/hookscope-src

  queue-stack:
    env:
      HOOKSCOPE_RULES_FILE: ./recipes/webhook-to-queue-on-aws/rules.json
    name: queue stack and Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format and validation only
        working-directory: recipes/webhook-to-queue-on-aws/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Require private service configuration
        run: >-
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml config --format json |
          python -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert all(not v.get("ports") for k,v in s.items() if k != "edge")'
      - name: Start private LocalStack queue demonstration
        run: docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml up --build --wait -d
      - name: Confirm queue acceptance before business processing
        run: |
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml stop worker
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml exec -T edge python smoke.py
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml start worker
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml exec -T edge python smoke.py completed
      - name: Verify persistent deduplication after worker and target restart
        run: |
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml restart worker target
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml up --wait -d
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml stop worker
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml exec -T edge python smoke.py
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml start worker
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml exec -T edge python smoke.py completed
      - name: Queue outage cannot acknowledge a producer
        run: |
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml stop localstack
          docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml exec -T edge python smoke.py queue-down
      - name: Stop queue demonstration
        if: always()
        run: docker compose --project-directory . -f docker-compose.base.yml -f recipes/webhook-to-queue-on-aws/docker-compose.yml -f recipes/webhook-to-queue-on-aws/private.yml down -v
