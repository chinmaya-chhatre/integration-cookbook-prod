name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: make lint

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make docs
      - name: External links (informational; other people's sites go down)
        continue-on-error: true
        run: python scripts/check_docs.py --external

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - uses: actions/checkout@v5
        with:
          repository: chinmaya-chhatre/hookscope-prod
          ref: b4e012c304ea69ca29fd544ab0ab2864e5cf11f6
          path: hookscope-src
      - run: pip install -r hookscope-src/requirements.txt
      - name: Verify integration dependency
        run: python -c "import hookscope.main; print(hookscope.main.__file__)"
        env:
          PYTHONPATH: ${{ github.workspace }}/hookscope-src
      - run: make test
        env:
          PYTHONPATH: ${{ github.workspace }}/hookscope-src
          PYTEST_ADDOPTS: --junitxml=test-results.xml
      - name: Require complete test execution
        run: python scripts/check_test_report.py test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

  compose:
    name: compose files are valid
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make config PYTHON=python

  discover:
    name: find recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "recipes=$(python3 scripts/list_recipes.py)" >> "$GITHUB_OUTPUT"

  recipe:
    # One job per recipe, so a failure names the recipe. A recipe with no tests fails here:
    # pytest exits non-zero when it collects nothing, and a recipe does not ship without tests.
    name: recipe ${{ matrix.recipe }}
    needs: discover
    if: needs.discover.outputs.recipes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.discover.outputs.recipes) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The end-to-end tests run HookScope in-process, so they need its source and dependencies.
      - uses: actions/checkout@v5
        with:
          repository: chinmaya-chhatre/hookscope-prod
          ref: b4e012c304ea69ca29fd544ab0ab2864e5cf11f6
          path: hookscope-src
      - run: pip install -r hookscope-src/requirements.txt
      - run: make test RECIPE=${{ matrix.recipe }}
        env:
          PYTHONPATH: ${{ github.workspace }}/hookscope-src
